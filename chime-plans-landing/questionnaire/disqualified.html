    <script>
      (function () {
        var p = new URLSearchParams(location.search);
        // quiz-logic.js sends ?back= the question just answered, and ?next= the exit.
        // Both are validated: an unchecked value here is an open redirect.
        //
        // The shapes allowed are exactly the ones this funnel produces:
        //   step5.html              a question, same directory
        //   ../index.html           the English exit, from questionnaire/
        //   ../../es/index.html     the Spanish exit, from questionnaire/es/
        // Widened for the Spanish mirror, deliberately and narrowly. It still refuses
        // an absolute URL (":" is not in the character class), a protocol-relative
        // "//host" and a leading "/". scripts/verify/verify.mjs drives
        // ?back=https://evil.example/x.html against it.
        var okUrl = function (v) {
          return v && /^(?:\.\.\/){0,2}(?:es\/)?[\w.-]+\.html(?:\?[\w=&.%-]*)?$/.test(v) ? v : "";
        };
        var back = okUrl(p.get("back"));
        var exit = okUrl(p.get("next")) || (/\/es\/$/.test(location.pathname.slice(0, location.pathname.lastIndexOf("/") + 1)) ? "../../index.html" : "../index.html");
        document.getElementById("dqBack").addEventListener("click", function () {
          if (back) location.href = back;
          else if (history.length > 1) history.back();
          else location.href = "step1.html";
        });
        // Keeping a disqualifying answer exits the funnel.
        document.getElementById("dqKeep").addEventListener("click", function () {
          location.href = exit;
        });
      })();
    </script>
