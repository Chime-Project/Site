<div class="w-full sticky sm:top-20 top-16 z-2">

    <main class="w-full px-5 py-6 sm:py-16 sm:px-5 flex-1">
      <div class="mx-auto flex w-full flex-col items-center gap-6 sm:max-w-4xl sm:gap-10 transition-all duration-300">
        <section class="flex flex-col items-center gap-1">
          <h1 data-slot="heading" class="inline-flex items-baseline gap-1 font-bold [&amp;>svg]:size-[1em] [&amp;>svg]:translate-y-[0.125em] text-xl sm:text-2xl text-[#606D5B] text-center">
            Let's make sure our providers have the full picture
          </h1>
          <p class="inline-flex items-baseline gap-1.5 text-base [&amp;>svg]:size-[1em] [&amp;>svg]:translate-y-[0.125em] text-center text-neutral-800 font-normal">
            Please answer each question below.
          </p>
        </section>
        <form class="flex w-full flex-col gap-6" data-quiz-owned novalidate>
            <div class="flex w-full flex-col gap-1.5">
              <label for="bloodPressure" class="font-medium text-neutral-800 text-base">
                What is your average blood pressure range? <span class="text-red-500">*</span>
              </label>
              <select
                id="bloodPressure"
                name="bloodPressure" required
                class="w-full cursor-pointer rounded-lg border border-neutral-300 bg-white px-4 py-2.5 text-base text-neutral-950 transition-colors duration-200 hover:border-neutral-700 focus:outline-none"
              >
                <option value="">Select an option</option>
                <option value="Less than 120/80 (Normal)">Less than 120/80 (Normal)</option>
                <option value="120-129/less than 80 (Elevated)">120-129/less than 80 (Elevated)</option>
                <option value="130-139/80-89 (High Stage 1)">130-139/80-89 (High Stage 1)</option>
                <option value="140/90 or higher (High Stage 2)">140/90 or higher (High Stage 2)</option>
              </select>
            </div>

            <div class="flex w-full flex-col gap-1.5">
              <label for="restingHeartRate" class="font-medium text-neutral-800 text-base">
                How about your average resting heart rate? <span class="text-red-500">*</span>
              </label>
              <select
                id="restingHeartRate"
                name="restingHeartRate" required
                class="w-full cursor-pointer rounded-lg border border-neutral-300 bg-white px-4 py-2.5 text-base text-neutral-950 transition-colors duration-200 hover:border-neutral-700 focus:outline-none"
              >
                <option value="">Select an option</option>
                <option value="Less than 60 beats per minute (Slow)">Less than 60 beats per minute (Slow)</option>
                <option value="60-100 beats per minute (Normal)">60-100 beats per minute (Normal)</option>
                <option value="101-110 beats per minute (Slightly Fast)">101-110 beats per minute (Slightly Fast)</option>
                <option value="More than 110 beats per minute (Fast)">More than 110 beats per minute (Fast)</option>
              </select>
            </div>

            <div class="flex w-full flex-col gap-1.5">
              <label for="lastMedicalEvaluation" class="font-medium text-neutral-800 text-base">
                When was the last time you had an in-person Medical Evaluation? <span class="text-red-500">*</span>
              </label>
              <select
                id="lastMedicalEvaluation"
                name="lastMedicalEvaluation" required
                class="w-full cursor-pointer rounded-lg border border-neutral-300 bg-white px-4 py-2.5 text-base text-neutral-950 transition-colors duration-200 hover:border-neutral-700 focus:outline-none"
              >
                <option value="">Select an option</option>
                <option value="Less than a year ago">Less than a year ago</option>
                <option value="1 to 2 years ago">1 to 2 years ago</option>
                <option value="More than 2 years ago">More than 2 years ago</option>
              </select>
            </div>

            <div class="flex w-full flex-col gap-1.5">
              <label for="lastLabTests" class="font-medium text-neutral-800 text-base">
                When was the last time you had Lab Tests done? <span class="text-red-500">*</span>
              </label>
              <select
                id="lastLabTests"
                name="lastLabTests" required
                class="w-full cursor-pointer rounded-lg border border-neutral-300 bg-white px-4 py-2.5 text-base text-neutral-950 transition-colors duration-200 hover:border-neutral-700 focus:outline-none"
              >
                <option value="">Select an option</option>
                <option value="Less than a year ago">Less than a year ago</option>
                <option value="1 to 2 years ago">1 to 2 years ago</option>
                <option value="More than 2 years ago">More than 2 years ago</option>
              </select>
            </div>

            <div class="flex w-full flex-col gap-1.5">
              <label for="prescriptionMedications" class="font-medium text-neutral-800 text-base">
                Are you currently taking any Prescription Medications? <span class="text-red-500">*</span>
              </label>
              <select
                id="prescriptionMedications"
                name="prescriptionMedications" required
                class="w-full cursor-pointer rounded-lg border border-neutral-300 bg-white px-4 py-2.5 text-base text-neutral-950 transition-colors duration-200 hover:border-neutral-700 focus:outline-none"
              >
                <option value="">Select an option</option>
                <option value="Yes - Please list the names and dosages">Yes - Please list the names and dosages</option>
                <option value="No - I affirm I'm not taking any medications">No - I affirm I'm not taking any medications</option>
              </select>
            </div>

            <div
              class="flex w-full flex-col gap-1.5"
              data-reveal-when="prescriptionMedications"
              data-reveal-value="Yes - Please list the names and dosages"
              hidden
            >
              <label for="prescriptionMedicationsInfo" class="font-medium text-neutral-800 text-base">
                Please list your medications, strengths, and how often you take them.
              </label>
              <textarea
                id="prescriptionMedicationsInfo"
                name="prescriptionMedicationsInfo"
                rows="3" data-reveal-required
                class="w-full rounded-lg border border-neutral-300 bg-white px-4 py-2.5 text-base text-neutral-950 focus:outline-none focus:border-neutral-700"
              ></textarea>
            </div>

            <div class="flex w-full flex-col gap-1.5">
              <label for="medicationAllergies" class="font-medium text-neutral-800 text-base">
                Do you have any medication allergies? <span class="text-red-500">*</span>
              </label>
              <select
                id="medicationAllergies"
                name="medicationAllergies" required
                class="w-full cursor-pointer rounded-lg border border-neutral-300 bg-white px-4 py-2.5 text-base text-neutral-950 transition-colors duration-200 hover:border-neutral-700 focus:outline-none"
              >
                <option value="">Select an option</option>
                <option value="Yes - Please list your allergies and any known reactions">Yes - Please list your allergies and any known reactions</option>
                <option value="No - I affirm I have no known drug allergies">No - I affirm I have no known drug allergies</option>
              </select>
            </div>

            <div
              class="flex w-full flex-col gap-1.5"
              data-reveal-when="medicationAllergies"
              data-reveal-value="Yes - Please list your allergies and any known reactions"
              hidden
            >
              <label for="medicationAllergiesInfo" class="font-medium text-neutral-800 text-base">
                Please list your allergies and any known reactions.
              </label>
              <textarea
                id="medicationAllergiesInfo"
                name="medicationAllergiesInfo"
                rows="3" data-reveal-required
                class="w-full rounded-lg border border-neutral-300 bg-white px-4 py-2.5 text-base text-neutral-950 focus:outline-none focus:border-neutral-700"
              ></textarea>
            </div>

            <div class="flex w-full flex-col gap-1.5">
              <label for="additionalDocInformation" class="font-medium text-neutral-800 text-base">
                Do you have any further information which you would like our medical team to know? <span class="text-red-500">*</span>
              </label>
              <select
                id="additionalDocInformation"
                name="additionalDocInformation" required
                class="w-full cursor-pointer rounded-lg border border-neutral-300 bg-white px-4 py-2.5 text-base text-neutral-950 transition-colors duration-200 hover:border-neutral-700 focus:outline-none"
              >
                <option value="">Select an option</option>
                <option value="Yes">Yes</option>
                <option value="No">No</option>
              </select>
            </div>

            <div
              class="flex w-full flex-col gap-1.5"
              data-reveal-when="additionalDocInformation"
              data-reveal-value="Yes"
              hidden
            >
              <label for="additionalDocInformationInfo" class="font-medium text-neutral-800 text-base">
                What would you like our medical team to know?
              </label>
              <textarea
                id="additionalDocInformationInfo"
                name="additionalDocInformationInfo"
                rows="3" data-reveal-required
                class="w-full rounded-lg border border-neutral-300 bg-white px-4 py-2.5 text-base text-neutral-950 focus:outline-none focus:border-neutral-700"
              ></textarea>
            </div>
        </form>
      </div>
