    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        const form = document.getElementById("step1Form");
        const continueLink = document.getElementById("step1Continue");
        const stateSelect = document.getElementById("state");
        const genderSelect = document.getElementById("gender");
        const monthInput = form.querySelector('[name="dateOfBirth.month"]');
        const dayInput = form.querySelector('[name="dateOfBirth.day"]');
        const yearInput = form.querySelector('[name="dateOfBirth.year"]');

        const fields = {
          state: stateSelect,
          gender: genderSelect,
          dob: monthInput,
        };

        // Keyed by each field's own name attribute, same convention as
        // updated_step6.tpl, so restoring on reload is a plain lookup.
        const step1Fields = [stateSelect, genderSelect, monthInput, dayInput, yearInput];
        const dobFields = [monthInput, dayInput, yearInput];

        // Date of birth is stored combined as a single "dob" value in
        // MM/DD/YYYY format (matching what db_action.php validates),
        // rather than as three separate sessionStorage entries.
        const DOB_STORAGE_KEY = "dob";

        function saveDateOfBirth() {
          const month = monthInput.value.trim();
          const day = dayInput.value.trim();
          const year = yearInput.value.trim();

          if (month && day && year) {
            sessionStorage.setItem(
              DOB_STORAGE_KEY,
              `${month.padStart(2, "0")}/${day.padStart(2, "0")}/${year.padStart(4, "0")}`
            );
          } else {
            sessionStorage.removeItem(DOB_STORAGE_KEY);
          }
        }

        function restoreDateOfBirth() {
          const saved = sessionStorage.getItem(DOB_STORAGE_KEY);
          const match = saved && saved.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
          if (!match) {
            return;
          }

          const [, month, day, year] = match;
          monthInput.value = month;
          dayInput.value = day;
          yearInput.value = year;
        }

        function restoreStep1Fields() {
          [stateSelect, genderSelect].forEach(field => {
            const savedValue = sessionStorage.getItem(field.name);
            if (savedValue !== null) {
              field.value = savedValue;
              field.dispatchEvent(new Event("change", { bubbles: true }));
            }
          });

          restoreDateOfBirth();
        }

        restoreStep1Fields();

        function getMessageElement(field) {
          const fieldGroup = field.closest(".flex.flex-col.gap-1\\.5");
          return fieldGroup ? fieldGroup.querySelector("p:last-child") : null;
        }

        function setError(field, message) {
          const messageElement = getMessageElement(field);
          const fieldGroup = field.closest(".flex.flex-col.gap-1\\.5");

          if (messageElement) {
            messageElement.textContent = message;
            messageElement.classList.remove("text-red-07");
            messageElement.classList.add("text-red-600");
          }

          if (fieldGroup) {
            fieldGroup.querySelectorAll("input, select").forEach(input => {
              input.setAttribute("aria-invalid", "true");
            });
          }
        }

        function clearError(field) {
          const messageElement = getMessageElement(field);
          const fieldGroup = field.closest(".flex.flex-col.gap-1\\.5");

          if (messageElement) {
            messageElement.textContent = "";
          }

          if (fieldGroup) {
            fieldGroup.querySelectorAll("input, select").forEach(input => {
              input.removeAttribute("aria-invalid");
            });
          }
        }

        function getDateOfBirth() {
          const month = Number(monthInput.value.trim());
          const day = Number(dayInput.value.trim());
          const year = Number(yearInput.value.trim());

          if (!month || !day || !year) {
            return null;
          }

          const date = new Date(year, month - 1, day);
          const isValidDate =
            date.getFullYear() === year &&
            date.getMonth() === month - 1 &&
            date.getDate() === day;

          return isValidDate ? date : false;
        }

        function isAtLeastEighteen(date) {
          const today = new Date();
          const eighteenthBirthday = new Date(
            date.getFullYear() + 18,
            date.getMonth(),
            date.getDate()
          );

          return eighteenthBirthday <= today;
        }

        function validateStep1Form() {
          let isValid = true;
          Object.values(fields).forEach(clearError);

          if (!stateSelect.value) {
            setError(fields.state, "Please select your state.");
            isValid = false;
          }

          if (!genderSelect.value) {
            setError(fields.gender, "Please select your sex assigned at birth.");
            isValid = false;
          }

          const dateOfBirth = getDateOfBirth();
          if (dateOfBirth === null) {
            setError(fields.dob, "Please enter your complete date of birth.");
            isValid = false;
          } else if (dateOfBirth === false) {
            setError(fields.dob, "Please enter a valid date of birth.");
            isValid = false;
          } else if (dateOfBirth > new Date()) {
            setError(fields.dob, "Date of birth cannot be in the future.");
            isValid = false;
          } else if (!isAtLeastEighteen(dateOfBirth)) {
            setError(fields.dob, "You must be at least 18 years old to continue.");
            isValid = false;
          }

          if (!isValid) {
            const firstInvalid = form.querySelector('[aria-invalid="true"]');
            if (firstInvalid) {
              firstInvalid.focus();
            }
          }

          return isValid;
        }

        step1Fields.forEach(field => {
          const isDobField = dobFields.includes(field);

          function handleFieldChange() {
            clearError(field === dayInput || field === yearInput ? fields.dob : field);

            if (isDobField) {
              saveDateOfBirth();
            } else {
              sessionStorage.setItem(field.name, field.value);
            }
          }

          field.addEventListener("input", handleFieldChange);
          field.addEventListener("change", handleFieldChange);
        });

        form.addEventListener("submit", function (e) {
          if (!validateStep1Form()) {
            e.preventDefault();
          }
        });

        // continueLink.addEventListener("click", function (e) {
        //   if (!validateStep1Form()) {
        //     e.preventDefault();
        //     return;
        //   }

        //   e.preventDefault();
        //   window.location.href = continueLink.href;
        // });

        continueLink.addEventListener("click", function (e) {
            if (!validateStep1Form()) {
                e.preventDefault();
                return;
            }

            e.preventDefault();

            $("#loading-indicator").show();

            requestAnimationFrame(() => {
                setTimeout(() => {
                    window.location.href = continueLink.href;
                }, 200);
            });
        });

        window.addEventListener("pageshow", function () {
            $("#loading-indicator").hide();
        });

      });
    </script>
  </body>
</html>
