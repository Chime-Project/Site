<!DOCTYPE html>
<html lang="en" data-theme="energy-wellness">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chime Health — Add NAD+</title>
<link rel="stylesheet" href="styles.css?v=20260773">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  html { scroll-behavior: smooth; }
  html, body { margin: 0; }
  body { background: var(--bg-default); }

  /* NAD page theme wiring — palette primitives live HERE, not in the kit
     (ui_kits/nad/NadPage.jsx binds to these --nad-* vars only). The strip
     ramp is a cadmium monochrome fan: light → deep. */
  :root {
    --nad-strip-1: var(--color-cadmium-100);
    --nad-strip-2: var(--color-cadmium-200);
    --nad-strip-3: var(--color-cadmium-300);
    --nad-strip-4: var(--color-cadmium-500);
    --nad-strip-5: var(--color-cadmium-700);
    --nad-strip-6: var(--color-cadmium-800);
    --nad-ink-dark: var(--color-sand-950);
    --nad-ink-light: var(--bg-default);
    --nad-hairline-dark: color-mix(in srgb, var(--color-sand-950) 35%, transparent);
    --nad-band-dark: var(--color-sand-950);
    /* De-blue the semantic text stack for this page: the site-wide values
       resolve to the brand navy scale, which reads as leftover weight-loss
       blue against the cadmium ground. Warm sand inks instead (all ≥6:1 on
       the page's light grounds). */
    --text-default: var(--color-sand-950);
    --text-secondary: var(--color-sand-800);
    --text-muted: var(--color-sand-800);
  }

  /* Section scroll-reveal — same pattern as weight-loss.html. Unsupported
     browsers rest at the end state (visible). */
  @keyframes chime-reveal {
    from { opacity: 0; transform: translateY(28px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes nad-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: no-preference) {
    .reveal {
      animation: chime-reveal linear both;
      animation-timeline: view();
      animation-range: entry 2% cover 22%;
    }
    .nad-spin { animation: nad-spin 26s linear infinite; transform-origin: 50% 50%; }
  }

  /* Benefit strips — the vertical color-band moment. Hovered strip expands. */
  .nad-strips { display: flex; align-items: stretch; height: 74vh; }
  .nad-strip {
    flex: 1 1 0; display: flex; align-items: flex-start; justify-content: center;
    padding: 28px 0; overflow: hidden;
    transition: flex-grow .5s cubic-bezier(.2, .7, .2, 1);
  }
  .nad-strip:hover { flex-grow: 2.2; }
  .nad-strip-label {
    writing-mode: vertical-rl; transform: rotate(180deg);
    font-family: var(--font-family-base); font-weight: 700;
    font-size: clamp(20px, 2.4vw, 40px); letter-spacing: -0.01em;
    line-height: 1.15; max-height: 100%;
  }

  /* Hero CTA row stays on one line (it may outgrow the 520px copy column —
     that's fine, the hero has room); only phones are allowed to wrap. */
  .nad-hero-ctas { flex-wrap: nowrap; white-space: nowrap; }

  @media (max-width: 700px) {
    /* !important: the badge svg carries an inline display:block */
    .nad-badge { display: none !important; }
    .nad-hero-ctas { flex-wrap: wrap; white-space: normal; }
    .nad-hero-bottom { flex-direction: column; align-items: stretch; }
    .nad-hero-media {
      position: static !important; width: 100% !important;
      margin: var(--spacing-8) 0 0;
    }
    .nad-plus-grid { grid-template-columns: 1fr !important; }
    .nad-strips { flex-direction: column; height: auto; }
    .nad-strip {
      min-height: 76px; align-items: center; justify-content: flex-start;
      padding: 20px;
    }
    .nad-strip-label {
      writing-mode: horizontal-tb; transform: none; font-size: 24px;
    }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="ui_kits/homepage/AssessmentModal.jsx?v=20260773"></script>
<script type="text/babel" src="ui_kits/nad/NadPage.jsx?v=20260773"></script>
<script type="text/babel">
ReactDOM.createRoot(document.getElementById("root")).render(
  <React.Fragment>
    <NadPage />
    <ChimeAssessmentModal />
  </React.Fragment>
);
</script>
</body>
</html>
