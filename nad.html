<!DOCTYPE html>
<html lang="en" data-theme="default">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chime Health — Add NAD+</title>
<link rel="stylesheet" href="styles.css?v=20260773">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  html { scroll-behavior: smooth; }
  html, body { margin: 0; }
  body { background: var(--bg-default); }

  /* NAD page theme wiring — palette primitives live HERE, not in the kit
     (ui_kits/nad/NadPage.jsx binds to these --nad-* vars only). Main (default)
     Chime theme: the strip ramp is a brand-blue monochrome fan, light → deep,
     and the dark bands sit on the site's navy section ground (blue-950, the
     same ink as --glass-rgb). The semantic text stack is left alone — the
     site-wide navy values ARE this theme. */
  :root {
    --nad-strip-1: var(--color-blue-100);
    --nad-strip-2: var(--color-blue-200);
    --nad-strip-3: var(--color-blue-300);
    --nad-strip-4: var(--color-blue-500);
    --nad-strip-5: var(--color-blue-700);
    --nad-strip-6: var(--color-blue-800);
    --nad-ink-dark: var(--color-blue-950);
    --nad-ink-light: var(--bg-default);
    --nad-hairline-dark: color-mix(in srgb, var(--color-blue-950) 35%, transparent);
    --nad-band-dark: var(--color-blue-950);
    /* The kit grounds the hero + footer on --accent-default. The default
       theme's blue-500 is a mid tone no ink clears AA on (navy 3.9:1, white
       3.9:1), so this page pins the accent one stop lighter: same colored-band
       moment, and --nad-ink-dark reads 7.6:1 on blue-300 — AA at every size.
       On this page only the hero/footer grounds and the decorative "+" glyph
       consume --accent-default, so nothing else shifts. */
    --accent-default: var(--color-blue-300);
  }

  /* Section scroll-reveal — same pattern as weight-loss.html. Unsupported
     browsers rest at the end state (visible). */
  @keyframes chime-reveal {
    from { opacity: 0; transform: translateY(28px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes nad-spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: no-preference) {
    .reveal {
      animation: chime-reveal linear both;
      animation-timeline: view();
      animation-range: entry 2% cover 22%;
    }
    .nad-spin { animation: nad-spin 26s linear infinite; transform-origin: 50% 50%; }
  }

  /* Benefit strips — the vertical color-band moment. Hovered strip expands. */
  .nad-strips { display: flex; align-items: stretch; height: 74vh; }
  .nad-strip {
    flex: 1 1 0; display: flex; align-items: flex-start; justify-content: center;
    padding: 28px 0; overflow: hidden;
    transition: flex-grow .5s cubic-bezier(.2, .7, .2, 1);
  }
  .nad-strip:hover { flex-grow: 2.2; }
  .nad-strip-label {
    writing-mode: vertical-rl; transform: rotate(180deg);
    font-family: var(--font-family-base); font-weight: 700;
    font-size: clamp(20px, 2.4vw, 40px); letter-spacing: -0.01em;
    line-height: 1.15; max-height: 100%;
  }

  /* Hero CTA row stays on one line (it may outgrow the 520px copy column —
     that's fine, the hero has room); only phones are allowed to wrap. */
  .nad-hero-ctas { flex-wrap: nowrap; white-space: nowrap; }

  @media (max-width: 700px) {
    /* !important throughout this block: these fight inline styles that are
       correct on desktop (badge display, hero row alignment, plus-glyph
       sizing) — stylesheet !important is what outranks an inline style. */
    .nad-badge { display: none !important; }
    .nad-hero-word { display: none !important; }
    .nad-hero-ctas { flex-wrap: wrap; white-space: normal; }
    #offer { padding-top: var(--spacing-10) !important; padding-bottom: var(--spacing-10) !important; }
    /* desktop hero bleeds the wordmark to the bottom edge (padding-bottom 0);
       with the wordmark hidden on mobile the video needs breathing room */
    [data-screen-label="NAD Hero"] { padding-bottom: var(--spacing-10) !important; }
    [data-screen-label="What Is NAD+"] { padding-top: var(--spacing-10) !important; padding-bottom: var(--spacing-10) !important; }
    /* inline alignItems:flex-end is vertical in the desktop row but becomes
       horizontal (right-shove) once the column kicks in */
    .nad-hero-bottom { flex-direction: column; align-items: stretch !important; }
    /* recenter the vial-on-plus composition: desktop glyph floor (340px) and
       the 34% vial offset don't fit a phone column */
    .nad-plus-visual { min-height: 400px !important; }
    .nad-plus-visual span { font-size: min(88vw, 344px) !important; }
    /* keep a reduced offset so the vial rides the + arm instead of hiding
       the vertical stroke */
    .nad-plus-visual img { margin-left: 30% !important; height: min(300px, 62vw) !important; }
    .nad-hero-media {
      position: static !important; width: 100% !important;
      margin: var(--spacing-8) 0 0;
    }
    .nad-plus-grid { grid-template-columns: 1fr !important; }
    .nad-strips { flex-direction: column; height: auto; }
    .nad-strip {
      min-height: 76px; align-items: center; justify-content: flex-start;
      padding: 20px;
    }
    .nad-strip-label {
      writing-mode: horizontal-tb; transform: none; font-size: 24px;
    }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="ui_kits/homepage/AssessmentModal.jsx?v=20260773"></script>
<script type="text/babel" src="ui_kits/nad/NadPage.jsx?v=20260776"></script>
<script type="text/babel">
ReactDOM.createRoot(document.getElementById("root")).render(
  <React.Fragment>
    <NadPage />
    <ChimeAssessmentModal />
  </React.Fragment>
);
</script>
</body>
</html>
