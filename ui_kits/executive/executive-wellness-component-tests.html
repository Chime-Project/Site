<!DOCTYPE html>
<html lang="en" data-theme="wellness">
<head>
<meta charset="utf-8">
<title>Chime Executive Wellness — React component tests</title>
<!-- React component tests for the executive wellness landing (ui_kits/
     executive/ExecutiveWellnessPage.jsx + ExecutiveCore.jsx).
     RUN:  serve the repo, open /ui_kits/executive/executive-wellness-component-tests.html
     Headless: the runner sets window.__EXEC_WN_TEST_DONE and
     window.__EXEC_WN_TEST = {pass, fail, failures}, so a driver can poll.

     Same shape as executive-labs-component-tests.html and for the same
     reasons: no package.json, no node_modules — the harness loads the same
     React 18 UMD (the DEVELOPMENT build, so React's own warnings are
     assertable), the same Babel and the same component files the live page
     loads, and asserts against a real layout engine. GSAP is deliberately NOT
     loaded: the motion layer no-ops without it. The wall's marquee keyframes
     live in the page's <style>, not the kit, so here the tracks simply stand
     still — structure is asserted, not the page CSS. -->
<base href="../../">
<link rel="stylesheet" href="styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script>
  window.CHIME_UPLOADS_BASE = "uploads";
  window.CHIME_ASSETS_BASE = "assets";
  // React's dev-build warnings (missing keys, bad nesting, invalid props) go
  // through console.error — collect them and assert zero at the end.
  window.__REACT_WARNINGS = [];
  (function () {
    var orig = console.error;
    console.error = function () {
      var s = String(arguments[0]);
      if (s.indexOf("Warning:") === 0) window.__REACT_WARNINGS.push(s.slice(0, 200));
      return orig.apply(console, arguments);
    };
  })();
</script>
<style>
  body { font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; margin: 0; padding: 24px; background: #fff; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  .summary { padding: 10px 14px; border-radius: 6px; margin: 14px 0; font-weight: 700; }
  .summary.ok { background: #DCFCE7; color: #016630; }
  .summary.bad { background: #FFE2E2; color: #9F0712; }
  .t { padding: 2px 0; }
  .t.p::before { content: "PASS  "; color: #00A63E; }
  .t.f::before { content: "FAIL  "; color: #E7000B; font-weight: 700; }
  .t.f { color: #9F0712; }
  .why { padding-left: 6em; color: #62748E; white-space: pre-wrap; }
  .grp { margin-top: 14px; font-weight: 700; color: #314158; }
  /* Mounted off-screen but laid out (display:none would zero every rect). */
  #sandbox { position: absolute; left: -10000px; top: 0; width: 1280px; }
  /* The page vars the kit binds to (copied from executive-wellness.html). */
  :root {
    --exec-ground: var(--color-cadmium-300);
    --exec-ink-dark: color-mix(in srgb, var(--color-cadmium-800) 40%, black);
    --exec-band-dark: color-mix(in srgb, var(--color-cadmium-800) 40%, black);
    --exec-ink-light: var(--bg-default);
    --exec-hairline-dark: color-mix(in srgb, var(--exec-ink-dark) 35%, transparent);
    --exec-hairline-light: color-mix(in srgb, var(--bg-default) 35%, transparent);
  }
</style>
</head>
<body>
<h1>Chime Executive Wellness — React component tests</h1>
<div id="out"></div>
<div id="sandbox"></div>

<!-- Same files, same order as executive-wellness.html (minus GSAP and the
     assessment shim — the suite mocks window.openChimeAssessment). Bump ?v=
     with the page's tags. -->
<script type="text/babel" src="ui_kits/shared/ui/Reveal.jsx?v=20260716"></script>
<script type="text/babel" src="ui_kits/shared/ui/Icon.jsx?v=20260716"></script>
<script type="text/babel" src="ui_kits/shared/ui/Button.jsx?v=20260851"></script>
<script src="ui_kits/homepage/image-slot.js?v=20260718"></script>
<script type="text/babel" src="ui_kits/wellness/HWSymptomsSection.jsx?v=20260870"></script>
<script type="text/babel" src="ui_kits/labs/InsightStackSection.jsx?v=20260870"></script>
<script type="text/babel" src="ui_kits/homepage/Footer.jsx?v=20260840"></script>
<script src="ui_kits/executive/ExecutiveMotion.js?v=20260869"></script>
<script type="text/babel" src="ui_kits/executive/ExecutiveCore.jsx?v=20260869"></script>
<script type="text/babel" src="ui_kits/executive/ExecutiveWellnessPage.jsx?v=20260872"></script>

<script type="text/babel">
window.addEventListener("error", (e) => { window.__EXEC_WN_TEST_CRASH = String(e.message); });
window.addEventListener("unhandledrejection", (e) => {
  window.__EXEC_WN_TEST_CRASH = String((e.reason && e.reason.stack) || e.reason);
});
(async function () {
  "use strict";
  const out = document.getElementById("out");
  const sandbox = document.getElementById("sandbox");
  let pass = 0; const failures = [];
  const tick = (n = 0) => new Promise((r) => setTimeout(r, n));
  function group(name) { const d = document.createElement("div"); d.className = "grp"; d.textContent = name; out.appendChild(d); }
  function record(name, okFlag, why) {
    const d = document.createElement("div"); d.className = "t " + (okFlag ? "p" : "f"); d.textContent = name; out.appendChild(d);
    if (okFlag) { pass++; return; }
    failures.push(name + (why ? " — " + why : ""));
    const w = document.createElement("div"); w.className = "why"; w.textContent = why || ""; out.appendChild(w);
  }
  function show(v) {
    if (v && v.nodeType === 1) return "<" + v.tagName.toLowerCase() + (v.className && typeof v.className === "string" ? "." + v.className.trim().split(/\s+/).join(".") : "") + ">";
    try { return JSON.stringify(v); } catch (e) { return String(v); }
  }
  const ok = (name, v, why) => record(name, !!v, why || "expected truthy, got " + show(v));
  const eq = (name, a, b, why) => record(name, a === b, why || "expected " + show(b) + ", got " + show(a));
  const has = (name, hay, needle) => record(name, String(hay == null ? "" : hay).indexOf(needle) !== -1,
    "expected to contain " + JSON.stringify(needle) + ", got " + JSON.stringify(String(hay).slice(0, 160)));
  async function mount(element) {
    const host = document.createElement("div"); sandbox.appendChild(host);
    const root = ReactDOM.createRoot(host); root.render(element); await tick();
    return { host, $: (s) => host.querySelector(s), $$: (s) => Array.from(host.querySelectorAll(s)), text: () => host.textContent,
      unmount: () => { root.unmount(); host.remove(); } };
  }
  // Real cancelable click that bubbles to React's root; the document listener
  // records defaultPrevented then swallows the default so the harness page
  // never actually navigates (see the labs harness for the scar).
  let lastClickPrevented = false;
  document.addEventListener("click", (e) => { lastClickPrevented = e.defaultPrevented; e.preventDefault(); });
  const click = (el) => { el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: window })); return !lastClickPrevented; };

  try {

  // ================= Kit surface =================
  group("Kit surface (what the page relies on being on window)");
  ["ExecutiveWellnessPage", "ExecWnHero", "ExecWnSymptoms", "ExecWnGoals",
   "ExecWnWall", "ExecWnWallCard", "ExecWnClose", "ExecWnMembership", "ExecWnFinalCta",
   "ExecChrome", "ExecCta", "ExecKicker", "ExecSpinBadge", "execOpenAssessment",
   "ChimeHWSymptomsSection", "ChimeInsightStackSection", "ChimeFooter", "Button"].forEach((n) => {
    eq("window." + n + " is a function", typeof window[n], "function");
  });
  ok("window.ExecMotion.mount exists", window.ExecMotion && typeof window.ExecMotion.mount === "function");
  eq("without GSAP, ExecMotion.mount() returns a no-op cleanup", typeof window.ExecMotion.mount(document), "function");
  eq("the labs kit's INSIGHT_ICONS is readable (the wall's cards draw with it)", typeof INSIGHT_ICONS, "object");
  ok("…and carries the wall's five icons", ["bolt", "droplet", "nodes", "trendingUp", "heart"].every((k) => INSIGHT_ICONS[k]));

  // ================= Hero =================
  group("ExecWnHero");
  {
    const c = await mount(<ExecWnHero />);
    eq("h1 is the IA headline", c.$("h1").textContent, "Feel Like Yourself Again — Without Losing Momentum");
    has("subhead is the IA's", c.text(), "Personalized energy and recovery support, reviewed by a licensed provider, built around a schedule that doesn’t slow down.");
    eq("hero CTA label", c.$(".exec-hero-sub .exec-cta").textContent, "Discover Your Wellness Path");
    const v = c.$("video.exec-hero-video");
    ok("ambient video: autoplay + muted + loop + playsinline (iOS autoplay contract)", v.hasAttribute("autoplay") && v.muted && v.hasAttribute("loop") && v.hasAttribute("playsinline"));
    ok("video is decorative: aria-hidden + out of the tab order", v.getAttribute("aria-hidden") === "true" && v.getAttribute("tabindex") === "-1");
    has("video has the poster", v.getAttribute("poster"), "executive-hero-poster.webp");
    const expectMobile = window.matchMedia("(max-width: 700px)").matches;
    has("video source follows the viewport (" + (expectMobile ? "mobile" : "desktop") + " rendition)", v.getAttribute("src"), expectMobile ? "executive-hero-mobile.mp4" : "executive-hero.mp4");
    eq("wordmark is decorative", c.$(".exec-hero-word").getAttribute("aria-hidden"), "true");
    eq("wordmark reads MOMENTUM", c.$(".exec-hero-word").textContent, "MOMENTUM");
    ok("spin badge present and decorative", c.$(".exec-badge") && c.$(".exec-badge").getAttribute("aria-hidden") === "true");
    c.unmount();
  }

  // ================= Symptom stack (live module + override) =================
  group("ExecWnSymptoms (live ChimeHWSymptomsSection, performance labels)");
  {
    const c = await mount(<ExecWnSymptoms />);
    eq("section is the live module's (screen label Sound Familiar)", c.$("section").getAttribute("data-screen-label"), "Sound Familiar");
    eq("…themed energy-wellness by the module itself", c.$("section").getAttribute("data-theme"), "energy-wellness");
    has("part 1 headline", c.text(), "Does Any of This Sound Familiar?");
    const cards = c.$$(".hws-cards > div").filter((d) => d.textContent.trim());
    eq("five performance cards (the IA's 'only the 5 labels change')", cards.length, 5);
    eq("labels in order (3 verbatim IA + 2 derived)",
      cards.map((d) => d.textContent).join("|"),
      "Running on caffeine by 2pm|Recovery that lags behind training|Focus that fades before the day does|Mornings that start in a fog|Not performing at your best");
    has("part 2 IS the IA's Reframe row", c.text(), "What If Feeling Tired Isn't Normal?");
    has("part 2 keeps the live page's approved body", c.text(), "Many people adapt to low energy over time.");
    const btn = c.$("button");
    eq("module CTA is the IA's wellness CTA", btn && btn.textContent, "Discover Your Wellness Path");
    const calls = [];
    window.openChimeAssessment = () => calls.push(1);
    click(btn);
    eq("module CTA opens the assessment", calls.length, 1);
    delete window.openChimeAssessment;
    c.unmount();
  }
  {
    // Regression guard for wellness.html: the default mount is the old render.
    const c = await mount(<ChimeHWSymptomsSection />);
    const cards = c.$$(".hws-cards > div").filter((d) => d.textContent.trim());
    eq("prop-less mount keeps ALL EIGHT original cards (wellness.html unchanged)", cards.length, 8);
    eq("…starting with the original first label", cards[0].textContent, "Afternoon Energy Crashes");
    c.unmount();
  }

  // ================= Goal strips =================
  group("ExecWnGoals (two photo strips, Recognition language)");
  {
    const c = await mount(<ExecWnGoals />);
    eq("h2 is the IA headline", c.$("h2").textContent, "Wellness Means Different Things To Different People");
    eq("two strips", c.$$(".exec-goals-strip").length, 2);
    ok("the second strip mirrors the slant (-alt)", c.$$(".exec-goals-strip")[1].classList.contains("exec-goals-strip-alt"));
    ok("…and the first does not", !c.$$(".exec-goals-strip")[0].classList.contains("exec-goals-strip-alt"));
    eq("list semantics: 2 lists × 3 listitems", c.$$('[role="list"] > [role="listitem"]').length, 6);
    eq("six panels", c.$$(".exec-goals-panel").length, 6);
    const caps = c.$$(".exec-goals-caption");
    eq("captions numbered 01–06", caps.map((f) => f.textContent.match(/Goal (0\d)/)[1]).join(","), "01,02,03,04,05,06");
    eq("goals are the IA's six, in its order",
      caps.map((f) => f.textContent.replace(/Goal 0\d/, "")).join("|"),
      "More Energy|Sharper Focus|Better Recovery|Healthy Aging|Greater Vitality|Feeling Like Yourself Again");
    const imgs = c.$$(".exec-goals-media img");
    eq("one photo per panel", imgs.length, 6);
    ok("every photo has a real alt", imgs.every((i) => (i.getAttribute("alt") || "").length > 10));
    ok("photos lazy-load", imgs.every((i) => i.getAttribute("loading") === "lazy"));
    eq("photos are six distinct files", new Set(imgs.map((i) => i.getAttribute("src"))).size, 6);
    has("Goal 01 reuses the membership still (the existing positive frame)", imgs[0].getAttribute("src"), "executive-membership.webp");
    ok("the other five are the new goal stills", imgs.slice(1).every((i) => /executive-goal-/.test(i.getAttribute("src"))));
    eq("each panel: figure + figcaption + scrim", c.$$("figure.exec-goals-figure > figcaption.exec-goals-caption").length, 6);
    eq("…scrims", c.$$(".exec-goals-scrim").length, 6);
    c.unmount();
  }

  // ================= Wall =================
  group("ExecWnWall + ExecWnWallCard (full-screen marquee)");
  {
    const card = EXEC_WN_CARDS[0];
    const c = await mount(<ExecWnWallCard card={card} h={380} />);
    has("card keeps the fan's border language (10px accent stop)", c.$("div").getAttribute("style"), "10px solid var(--accent-active)");
    has("card title", c.text(), "NAD+");
    has("card fact opens with the IA's framing", c.text(), "Did you know?");
    ok("card draws its line icon (svg via INSIGHT_ICONS)", !!c.$("svg"));
    const a = c.$("a");
    eq("Explore link goes to the assessment", a.getAttribute("href"), "chimeAssessment.html");
    eq("…out of the tab order (it scrolls inside an aria-hidden marquee)", a.getAttribute("tabindex"), "-1");
    const calls = [];
    window.openChimeAssessment = () => calls.push(1);
    const allowed = click(a);
    eq("pointer click still opens the assessment", calls.length, 1);
    eq("…without navigating", allowed, false);
    delete window.openChimeAssessment;
    c.unmount();
  }
  {
    const c = await mount(<ExecWnWall />);
    eq("section screen label", c.$("section").getAttribute("data-screen-label"), "Did You Know Wall");
    eq("the moving wall is aria-hidden (content repeats, in motion)", c.$(".exec-wall-columns").getAttribute("aria-hidden"), "true");
    eq("four columns", c.$$(".exec-wall-col").length, 4);
    const tracks = c.$$(".exec-wall-track");
    ok("every track carries an inline duration for its keyframes", tracks.every((t) => /\d+s/.test(t.style.animationDuration)));
    eq("directions alternate up/down/up/down", tracks.map((t) => t.classList.contains("exec-wall-track-down") ? "down" : "up").join(","), "up,down,up,down");
    ok("each track = two IDENTICAL halves (the -50% loop's seamless contract)",
      tracks.every((t) => {
        const seqs = t.querySelectorAll(":scope > .exec-wall-seq");
        return seqs.length === 2 && seqs[0].innerHTML === seqs[1].innerHTML;
      }));
    const firstTwo = c.$$(".exec-wall-col").slice(0, 2);
    const titlesIn = (col) => new Set(Array.from(col.querySelectorAll(".exec-wall-seq > div > div:first-child > div:first-child")).map((d) => d.textContent));
    const union = new Set([...titlesIn(firstTwo[0]), ...titlesIn(firstTwo[1])]);
    eq("the first two columns alone carry all five cards (phones hide cols 3–4)", union.size, 5, "got " + Array.from(union).join(", "));
    const title = c.$(".exec-wall-title");
    ok("the title floats as a card of the same language (thick accent border)", title && title.getAttribute("style").indexOf("10px solid var(--accent-default)") !== -1);
    eq("title h2", title.querySelector("h2").textContent, "Discover What’s Possible");
    has("title sub keeps the module's approved line", title.textContent, "Health is connected.");
    const sr = c.$$(".exec-sr-only li");
    eq("static assistive copy: exactly the five facts", sr.length, 5);
    eq("…titled NAD+ / LIPO-C / Wellness Coaching / Labs & Health Insights / Provider Oversight",
      sr.map((li) => li.textContent.split(" — ")[0]).join(","),
      "NAD+,LIPO-C,Wellness Coaching,Labs & Health Insights,Provider Oversight");
    ok("…each with a real assessment link, still in the tab order",
      sr.every((li) => li.querySelector('a[href="chimeAssessment.html"]') && li.querySelector("a").tabIndex !== -1));
    c.unmount();
  }
  {
    // Regression guard for labs.html / executive-labs.html: default fan render.
    const c = await mount(<ChimeInsightStackSection theme="lab" />);
    eq("prop-less fan keeps its own headline", c.$(".insight-title").textContent, "One Insight Can Change Everything");
    eq("…and its five original cards", c.$$(".insight-stack > div").length, 5);
    has("…starting with Weight Management", c.$(".insight-stack").textContent, "Weight Management");
    c.unmount();
  }

  // ================= Close / Membership / Final =================
  group("ExecWnClose, ExecWnMembership, ExecWnFinalCta");
  {
    const c = await mount(<ExecWnClose />);
    eq("close h2", c.$("h2").textContent, "Most Wellness Programs Focus On Products. Chime Focuses On People.");
    ok("close h2 is the scrubbed statement (exec-scrub), not a masked heading", c.$("h2").classList.contains("exec-scrub") && !c.$("h2").classList.contains("exec-heading"));
    has("subtitle is the live wellness page's", c.text(), "Wellness should be personal, supportive, and designed around your individual goals.");
    eq("three kickers, the IA's chain", c.$$(".exec-kicker").map((k) => k.textContent.replace(/0\d/, "")).join(","), "Personalized Guidance,Wellness Coach Support,Provider Oversight");
    eq("numbered 01–03", c.$$(".exec-kicker").map((k) => k.textContent.match(/0\d/)[0]).join(","), "01,02,03");
    has("step bodies are the live Simple Path copy", c.text(), "Support, accountability, and encouragement along the way.");
    eq("CTA", c.$("a.exec-cta").textContent, "Discover Your Wellness Path");
    c.unmount();
    const m = await mount(<ExecWnMembership />);
    eq("membership h2", m.$("h2").textContent, "Support That Keeps Pace With You");
    has("membership sub", m.text(), "Ongoing coaching and adjustment, not a single visit.");
    eq("membership CTA", m.$("a.exec-cta").textContent, "Explore The Chime Membership");
    ok("membership still has alt", (m.$("figure img").getAttribute("alt") || "").length > 10);
    m.unmount();
    const f = await mount(<ExecWnFinalCta />);
    eq("final h2", f.$("h2").textContent, "Feel Like Yourself Again");
    eq("final CTA", f.$("a.exec-cta").textContent, "Discover Your Wellness Path");
    ok("final background image is decorative (empty alt + aria-hidden)", f.$(".exec-final-bg").getAttribute("alt") === "" && f.$(".exec-final-bg").getAttribute("aria-hidden") === "true");
    f.unmount();
  }

  // ================= Whole page =================
  group("ExecutiveWellnessPage (composition + a11y sweep)");
  {
    const c = await mount(<ExecutiveWellnessPage />);
    eq("exactly one <h1>", c.$$("h1").length, 1);
    ok("landmarks: header + main + footer", c.$("header") && c.$("main") && c.$("footer"));
    const order = c.$$("main > section[data-screen-label]").map((s) => s.getAttribute("data-screen-label"));
    eq("section order is the IA's (rows 2+3 share the symptom module)",
      order.join(" > "),
      "Exec Hero > Sound Familiar > Goal Cards > Did You Know Wall > 3-Step Close > Membership > Final CTA");
    has("footer is the site footer (ChimeFooter), not ExecFooter", c.$("footer").textContent, "hello@chimehealth.com");
    const imgs = c.$$("img");
    ok("every <img> has an alt attribute (" + imgs.length + " images)", imgs.every((i) => i.hasAttribute("alt")));
    const links = c.$$("a");
    ok("every <a> has an href (" + links.length + " links)", links.every((a) => a.getAttribute("href")));
    const buttons = c.$$("button");
    ok("every <button> has an accessible name (" + buttons.length + " buttons)", buttons.every((b) => (b.textContent.trim() || b.getAttribute("aria-label") || "").length > 0));
    const ctas = c.$$("main a.exec-cta");
    ok("every exec CTA goes to the assessment (" + ctas.length + ")", ctas.every((a) => a.getAttribute("href") === "chimeAssessment.html"));
    const hs = c.$$("h1,h2,h3,h4").map((h) => Number(h.tagName[1]));
    let jump = null;
    for (let i = 1; i < hs.length; i++) if (hs[i] > hs[i - 1] + 1) { jump = hs[i - 1] + "→" + hs[i] + " at #" + i; break; }
    eq("heading levels never skip (h1→h3)", jump, null);
    // theme guard at the DOM level — exec sections only: the symptom stack is
    // the wellness kit's own module (it carries cadmium primitives by design),
    // and the site footer is a homepage kit with its own fixed navy.
    const bad = c.$$("main [style]")
      .filter((el) => !el.closest('[data-screen-label="Sound Familiar"]'))
      .filter((el) => /--color-(iris|tide|cadmium|sage|peach|blue)-\d|#[0-9a-fA-F]{6}\b/.test(el.getAttribute("style") || ""));
    eq("no palette primitives / brand hex in the rendered exec sections", bad.length, 0, bad.slice(0, 3).map(show).join(", "));
    c.unmount();
  }

  // ================= React warnings =================
  group("React dev-build warnings");
  eq("no React warnings across every mount (keys, props, DOM nesting)",
    window.__REACT_WARNINGS.length, 0, window.__REACT_WARNINGS.slice(0, 3).join(" | "));

  } catch (err) {
    failures.push("SUITE CRASHED: " + ((err && err.stack) || err));
  }

  const s = document.createElement("div");
  s.className = "summary " + (failures.length ? "bad" : "ok");
  s.textContent = failures.length ? "FAIL — " + pass + " passed, " + failures.length + " failed" : "PASS — " + pass + " checks";
  out.insertBefore(s, out.firstChild);
  window.__EXEC_WN_TEST = { pass: pass, fail: failures.length, failures: failures };
  window.__EXEC_WN_TEST_DONE = true;
})();
</script>
</body>
</html>
