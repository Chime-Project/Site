    <!-- Chime Health: GLP-1 price-lock intake, a clone of TrimRx's intake (start.trimrx.com/intake/glp1/<step>), the
         questionnaire between their price-lock offer and their plan selection. Step 2 of chime-price-lock-flow/, the
         self-contained copy of TrimRx's whole flow: landing ../index.html → this questionnaire → ../selection/.
         Client request 2026-10-08 ("go back to the base landing page, look up the checkout flow, add it to ours"; Luis:
         a new request, so it lives in its own folder — chime-price-lock-offer/ and chime-price-lock-selection/ are
         left as they were). Branding only: their steps, order, copy, layout, art and Tailwind classes.
         GENERATED by uploads/price-lock-intake-ref/build.py — edit the generator, not these files.

         One page per step (index.html = height_weight). js/intake.js replaces their form posts: it validates like
         theirs, keeps the answers in sessionStorage (this browser only; NOTHING is sent anywhere — there is no
         backend), fills the personalised lines (BMI, goal, pace, weeks, first name — their formulas, measured from
         their pages), and routes the branches exactly as theirs do: pregnancy only for women, "Women"/"Men"
         wording, a dose step for current Semaglutide / Tirzepatide users, three follow-ups to the pace question.
         The contact step's Next goes to ../selection/, as theirs goes to checkout/selection.

         CHANGED (branding only): logo → Chime in their logo box (and the white one over the opening photo); the
         name in the copy → Chime Health; the two charts' "TrimRx" marks repainted with Chime's (repaint.py);
         tab title, favicon. REMOVED: the "Featured coverage in Forbes / WebMD / yahoo! / New York Post ★★★★★" strip
         on every step, and their step 7 "TrimRx is proud to be ranked #1" (a Yahoo Health / Top10.com ranking of
         TrimRx) — both are TrimRx's press and ranking, which Chime does not have. Lora is self-hosted.

         FLAGGED, kept as the reference has it — none of it is confirmed for Chime: "Join Over 500K Success Stories",
         "patients lose over 20% of their body weight", "94% chance of treatment success", "medical providers review
         every form within 24 hours", the three testimonials with their before/after photos and names, the pace
         and weeks maths, the health-condition and medication questions (no answer disqualifies — the same as
         theirs, which hands everything to provider review), and the HIPAA / contact consent wording. -->
