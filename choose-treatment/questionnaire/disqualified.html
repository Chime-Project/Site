  <script>
    (function () {
      var params = new URLSearchParams(location.search);

      // Ported from GLPQuizFR, including its guard: an unchecked ?back= here is an
      // open redirect. Narrowed to this funnel's flat layout, so the only shape
      // allowed is a same-directory html page such as step10.html. It still refuses
      // an absolute URL (":" is not in the class), a protocol-relative "//host",
      // and a leading "/".
      function okUrl(v) {
        return v && /^[\w.-]+\.html(?:\?[\w=&.%-]*)?$/.test(v) ? v : "";
      }

      var back = okUrl(params.get("back"));
      var exit = okUrl(params.get("next")) || "../../index.html";

      document.getElementById("dqBack").addEventListener("click", function () {
        if (back) location.href = back;
        else if (history.length > 1) history.back();
        else location.href = "step1.html";
      });

      // Keeping a disqualifying answer exits the funnel, same as the reference.
      document.getElementById("dqKeep").addEventListener("click", function () {
        location.href = exit;
      });
    })();
  </script>
