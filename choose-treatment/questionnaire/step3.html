  <script src="js/funnel-state.js?v=20260945"></script>
  <script>
    const continueBtn = document.getElementById("continueBtn");
    const paceInputs = document.querySelectorAll('input[name="pace"]');

    function selected() {
      for (const el of paceInputs) if (el.checked) return el.value;
      return "";
    }

    function render() {
      if (continueBtn) continueBtn.disabled = selected() === "";
    }

    paceInputs.forEach((el) => el.addEventListener("change", render));

    (function restore() {
      const saved = FunnelState.get("pace", "");
      if (saved) {
        paceInputs.forEach((el) => {
          if (el.value === saved) el.checked = true;
        });
      }
      render();
    })();

    continueBtn?.addEventListener("click", () => {
      if (continueBtn.disabled) return;
      FunnelState.save({ pace: selected() });
      window.location.assign("step4.html");
    });
  </script>
