  <script>
    // S10's back button follows whichever route the visitor took: women come
    // via the female health screen, everyone else comes straight from S9.
    // This lives in the generator because regenerating this page's script is
    // exactly how it got lost once before.
    (function backTarget() {
      var sex = "";
      try { sex = (FunnelState.get("sex", "") || "").toLowerCase(); } catch (e) {}
      var link = document.getElementById("backLink");
      if (link && sex === "female") link.setAttribute("href", "step9b.html");
    })();

    const continueBtn = document.getElementById("continueBtn");
    const boxes = Array.prototype.slice.call(
      document.querySelectorAll('input[name="healthConditions"]')
    );
    const noneBox = boxes.filter((b) => b.hasAttribute("data-none"))[0] || null;
    const others = boxes.filter((b) => b !== noneBox);

    // "None" is exclusive in both directions.
    noneBox && noneBox.addEventListener("change", function () {
      if (noneBox.checked) others.forEach((b) => (b.checked = false));
      sync();
    });
    others.forEach((b) =>
      b.addEventListener("change", function () {
        if (b.checked && noneBox) noneBox.checked = false;
        sync();
      })
    );

    function selected() {
      return boxes.filter((b) => b.checked).map((b) => b.value);
    }
    function sync() {
      if (continueBtn) continueBtn.disabled = selected().length === 0;
    }

    (function restore() {
      const prior = FunnelState.get("healthConditions", null);
      if (Array.isArray(prior)) {
        boxes.forEach((b) => {
          if (prior.indexOf(b.value) !== -1) b.checked = true;
        });
      }
      sync();
    })();

    continueBtn?.addEventListener("click", () => {
      if (continueBtn.disabled) return;
      FunnelState.save({ healthConditions: selected() });
      // Before validation and before navigation, exactly as the reference does.
      if (QuizDQ.check("step10.html")) return;
      window.location.assign("step11.html");
    });
  </script>
