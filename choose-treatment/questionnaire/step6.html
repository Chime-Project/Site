  <script src="js/funnel-state.js?v=20260942"></script>
  <script>
    const continueBtn = document.getElementById("continueBtn");

    continueBtn?.addEventListener("click", () => {
      // Chime: the clinician needs this, and the checkout preselects the treatment from it.
      const picked = document.querySelector('input[name="medication"]:checked');
      const val = (id) => { const el = document.getElementById(id) || document.querySelector('[name="' + id + '"]'); return el ? el.value : ""; };
      const med = !picked ? "" : picked.id === "medication-yes" ? "semaglutide" : picked.id === "medication-other" ? "tirzepatide" : "none";
      if (window.FunnelState) FunnelState.save({
        glp1_history: med,
        glp1_dose: med === "semaglutide" ? val("semaglutide_dose") : med === "tirzepatide" ? val("tirzepatide_dose") : "",
        glp1_last_taken: med === "semaglutide" ? val("semaglutide_last_taken") : med === "tirzepatide" ? val("tirzepatide_last_taken") : "",
        glp1_continue_plan: med === "semaglutide" ? val("semaglutide_continue_plan") : med === "tirzepatide" ? val("tirzepatide_continue_plan") : "",
      });
      window.location.assign("step7.html");
    });
  </script>
  <script>
    // Show/hide the Semaglutide / Tirzepatide follow-up questions based on
    // which medication option the user selects. Purely additive — does not
    // touch the existing continue button or optional textarea behavior.
    const semaglutideRadio = document.getElementById("medication-yes");
    const tirzepatideRadio = document.getElementById("medication-other");
    const noneRadio = document.getElementById("medication-no");

    const semaglutideFollowup = document.getElementById("semaglutide-followup");
    const tirzepatideFollowup = document.getElementById("tirzepatide-followup");

    function updateFollowupVisibility() {
      if (semaglutideRadio.checked) {
        semaglutideFollowup.classList.remove("hidden");
        tirzepatideFollowup.classList.add("hidden");
      } else if (tirzepatideRadio.checked) {
        tirzepatideFollowup.classList.remove("hidden");
        semaglutideFollowup.classList.add("hidden");
      } else {
        semaglutideFollowup.classList.add("hidden");
        tirzepatideFollowup.classList.add("hidden");
      }
    }

    [semaglutideRadio, tirzepatideRadio, noneRadio].forEach((radio) => {
      radio?.addEventListener("change", updateFollowupVisibility);
    });
  </script>
