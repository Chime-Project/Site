    };
    var STATE_NAMES = {
      AL: "Alabama",
      AK: "Alaska",
      AZ: "Arizona",
      AR: "Arkansas",
      CA: "California",
      CO: "Colorado",
      CT: "Connecticut",
      DE: "Delaware",
      FL: "Florida",
      GA: "Georgia",
      HI: "Hawaii",
      ID: "Idaho",
      IL: "Illinois",
      IN: "Indiana",
      IA: "Iowa",
      KS: "Kansas",
      KY: "Kentucky",
      LA: "Louisiana",
      ME: "Maine",
      MD: "Maryland",
      MA: "Massachusetts",
      MI: "Michigan",
      MN: "Minnesota",
      MS: "Mississippi",
      MO: "Missouri",
      MT: "Montana",
      NE: "Nebraska",
      NV: "Nevada",
      NH: "New Hampshire",
      NJ: "New Jersey",
      NM: "New Mexico",
      NY: "New York",
      NC: "North Carolina",
      ND: "North Dakota",
      OH: "Ohio",
      OK: "Oklahoma",
      OR: "Oregon",
      PA: "Pennsylvania",
      RI: "Rhode Island",
      SC: "South Carolina",
      SD: "South Dakota",
      TN: "Tennessee",
      TX: "Texas",
      UT: "Utah",
      VT: "Vermont",
      VA: "Virginia",
      WA: "Washington",
      WV: "West Virginia",
      WI: "Wisconsin",
      WY: "Wyoming",
    };
    var MAP_W = 959;
    var MAP_H = 593;
    var FALLBACK_HEIGHT = 260; // must match the .map-frame height in CSS

    // ---- Manual per-state overrides ----
    // cx, cy : center of the view, in the SAME coordinate units as the
    //          state paths (0-959 horizontally, 0-593 vertically)
    // w      : width of the visible window -- SMALLER = more zoomed in
    // IL widened from 265 -> 320 to show more of the surrounding states
    // (Iowa, Missouri, Wisconsin, Indiana, Michigan's peninsula) per the
    // reference image.
    var STATE_VIEW_OVERRIDES = {
      CA: { cx: 90, cy: 267, w: 300 },
      IL: { cx: 590, cy: 258, w: 320 },
      // TX: { cx: 404, cy: 452, w: 420 },
      // RI: { cx: 878, cy: 172, w: 260 },
    };

    var ZOOM_PADDING_FACTOR_W = 1.7;
    var ZOOM_PADDING_FACTOR_H = 1.35;
    var MIN_WINDOW_W = 190;

    var currentStateCode = "IL";

    function computeZoomViewBox(stateCode) {
      var c = STATE_CENTROIDS[stateCode];
      var override = STATE_VIEW_OVERRIDES[stateCode] || {};
      var container = document.getElementById("map-container");
      var rect = container.getBoundingClientRect();
      var containerW = rect.width || 528;
      var containerH = rect.height;
      if (containerH < 10) containerH = FALLBACK_HEIGHT;
      var containerAspect = containerW / containerH;

      var stateW = c.xmax - c.xmin;
      var stateH = c.ymax - c.ymin;
      var wFromWidth = stateW * ZOOM_PADDING_FACTOR_W;
      var wFromHeight = stateH * ZOOM_PADDING_FACTOR_H * containerAspect;
      var autoWindowW = Math.max(MIN_WINDOW_W, wFromWidth, wFromHeight);

      var windowW = override.w !== undefined ? override.w : autoWindowW;
      windowW = Math.min(windowW, MAP_W * 1.3);
      var windowH = windowW / containerAspect;

      var centerX = override.cx !== undefined ? override.cx : c.cx;
      var centerY = override.cy !== undefined ? override.cy : c.cy;

      var x = centerX - windowW / 2;
      var y = centerY - windowH / 2;

      return { x: x, y: y, w: windowW, h: windowH };
    }

    function positionClusters(stateCode, viewBoxWindow) {
      var c = STATE_CENTROIDS[stateCode];
      var override = STATE_VIEW_OVERRIDES[stateCode] || {};
      var container = document.getElementById("map-container");
      var rect = container.getBoundingClientRect();
      var containerW = rect.width || 528;

      var markerX = override.markerCx !== undefined ? override.markerCx : c.cx;
      var markerY = override.markerCy !== undefined ? override.markerCy : c.cy;

      var scale = containerW / viewBoxWindow.w;
      var pointX = (markerX - viewBoxWindow.x) * scale;
      var pointY = (markerY - viewBoxWindow.y) * scale;

      var avatarCluster = document.getElementById("avatar-cluster");
      var medCluster = document.getElementById("med-cluster");

      // Each cluster is now a single pre-composed image (doctor-avatars.webp,
      // products.webp), so centering uses the image's own actual rendered
      // width/height (offsetWidth/offsetHeight) rather than the old
      // hardcoded pixel offsets tuned for a row of overlapping circles.
      // offsetWidth is available immediately since width is fixed via the
      // w-32/w-36 Tailwind classes; offsetHeight depends on the image
      // having loaded (natural aspect ratio) -- falls back to a sane
      // default before that, and gets corrected via the "load" listeners
      // registered in renderDeliveryMap()/below.
      var avatarW = avatarCluster.offsetWidth || 128;
      var avatarH = avatarCluster.offsetHeight || 60;
      var medW = medCluster.offsetWidth || 144;
      var medH = medCluster.offsetHeight || 50;

      // Avatars sit just above the state, bottom edge near the marker;
      // medication cluster sits just below, top edge near the marker.
      avatarCluster.style.left = pointX - avatarW / 2 + "px";
      avatarCluster.style.top = pointY - avatarH - 40 + "px";

      medCluster.style.left = pointX - medW / 2 + "px";
      medCluster.style.top = pointY + 6 + "px";
    }

    // Once each cluster image actually loads, its real aspect ratio is
    // known -- reposition so the offsetHeight-based centering above is
    // accurate instead of relying on the pre-load fallback estimate.
    ["avatar-cluster", "med-cluster"].forEach(function (id) {
      var img = document.getElementById(id);
      if (img) {
        img.addEventListener("load", function () {
          updateMapView(currentStateCode);
        });
      }
    });

    function updateMapView(stateCode) {
      var vb = computeZoomViewBox(stateCode);
      var svg = document.getElementById("us-map");
      svg.setAttribute(
        "viewBox",
        vb.x.toFixed(1) +
          " " +
          vb.y.toFixed(1) +
          " " +
          vb.w.toFixed(1) +
          " " +
          vb.h.toFixed(1),
      );
      positionClusters(stateCode, vb);
    }

    function renderDeliveryMap(stateCode) {
      var code = (stateCode || "CA").toUpperCase();
      var name = STATE_NAMES[code];
      if (!STATE_CENTROIDS[code] || !name) {
        console.warn("Unknown state code:", stateCode);
        return;
      }

      currentStateCode = code;
      document.getElementById("state-pill").textContent = name;

      document.querySelectorAll(".us-state").forEach(function (el) {
        el.classList.remove("is-selected");
      });
      var target = document.getElementById("state-" + code);
      if (target) target.classList.add("is-selected");

      updateMapView(code);
    }

    var resizeTimeout;
    window.addEventListener("resize", function () {
      clearTimeout(resizeTimeout);
      resizeTimeout = setTimeout(function () {
        updateMapView(currentStateCode);
      }, 100);
    });

    // ---- LIVE TUNING TOOL (remove or comment out before shipping) ----
    // 1. Load the page, open the browser console.
    // 2. Run: renderDeliveryMap("TX")  (or whichever state you're tuning)
    // 3. Click the map, then use:
    //      Arrow keys  -> pan the view
    //      + / -       -> zoom in / out
    //      p           -> print the current override object to console
    // 4. Copy the printed object into STATE_VIEW_OVERRIDES above.
    (function setupLiveTuner() {
      var PAN_STEP = 8;
      var ZOOM_STEP = 15;

      document.addEventListener("keydown", function (e) {
        var vb = document
          .getElementById("us-map")
          .getAttribute("viewBox")
          .split(" ")
          .map(Number);
        var x = vb[0],
          y = vb[1],
          w = vb[2];
        var c = STATE_CENTROIDS[currentStateCode];

        if (!STATE_VIEW_OVERRIDES[currentStateCode]) {
          STATE_VIEW_OVERRIDES[currentStateCode] = {};
        }
        var ov = STATE_VIEW_OVERRIDES[currentStateCode];

        switch (e.key) {
          case "ArrowLeft":
            ov.cx = (ov.cx !== undefined ? ov.cx : x + w / 2) - PAN_STEP;
            break;
          case "ArrowRight":
            ov.cx = (ov.cx !== undefined ? ov.cx : x + w / 2) + PAN_STEP;
            break;
          case "ArrowUp":
            ov.cy = (ov.cy !== undefined ? ov.cy : y + w / 2) - PAN_STEP;
            break;
          case "ArrowDown":
            ov.cy = (ov.cy !== undefined ? ov.cy : y + w / 2) + PAN_STEP;
            break;
          case "+":
          case "=":
            ov.w = Math.max(40, (ov.w !== undefined ? ov.w : w) - ZOOM_STEP);
            break;
          case "-":
          case "_":
            ov.w = (ov.w !== undefined ? ov.w : w) + ZOOM_STEP;
            break;
          case "p":
          case "P":
            console.log(
              currentStateCode +
                ": " +
                JSON.stringify({
                  cx:
                    Math.round((ov.cx !== undefined ? ov.cx : c.cx) * 10) / 10,
                  cy:
                    Math.round((ov.cy !== undefined ? ov.cy : c.cy) * 10) / 10,
                  w: Math.round((ov.w !== undefined ? ov.w : w) * 10) / 10,
                }),
            );
            return;
          default:
            return;
        }
        e.preventDefault();
        updateMapView(currentStateCode);
      });
    })();

    /*
     * This screen used to announce "We deliver to Illinois" to everyone,
     * because it called renderDeliveryMap("IL") with a literal and nothing
     * upstream stored the state. S7 now saves the code, so the map zooms to
     * whichever state the visitor actually picked.
     *
     * The map already carried all 50 state paths and a centroid for each, so
     * nothing new had to be drawn. Illinois stays the fallback for a deep link
     * or cleared storage.
     */
    document.addEventListener("DOMContentLoaded", function () {
      var stored = "";
      try {
        stored = (window.FunnelState && FunnelState.get("state", "")) || "";
      } catch (e) {}
      var code = String(stored).toUpperCase();
      var known = STATE_CENTROIDS[code] && STATE_NAMES[code];
      renderDeliveryMap(known ? code : "IL");
    });
    window.addEventListener("load", function () {
      updateMapView(currentStateCode);
      requestAnimationFrame(function () {
        updateMapView(currentStateCode);
      });
    });
  </script>
