  <script src="js/funnel-state.js?v=20260943"></script>
  <script>
    const continueBtn = document.getElementById("continueBtn");
    const FIELDS = ["bloodPressure","restingHeartRate","lastMedicalEvaluation","lastLabTests","prescriptionMedications","medicationAllergies","additionalDocInformation"];
    const FOLLOW = ["prescriptionMedications","medicationAllergies","additionalDocInformation"];

    const el = (id) => document.getElementById(id);

    // FR shows the free-text box only when the answer starts "Yes".
    function syncFollowUps() {
      FOLLOW.forEach((id) => {
        const wrap = el(id + "_wrap");
        if (wrap) wrap.hidden = !/^Yes/i.test(el(id) ? el(id).value : "");
      });
    }

    function complete() {
      return FIELDS.every((id) => el(id) && el(id).value) &&
        FOLLOW.every((id) => {
          const wrap = el(id + "_wrap");
          if (!wrap || wrap.hidden) return true;
          const box = el(id + "_info");
          return box && box.value.trim().length > 0;
        });
    }

    function sync() {
      syncFollowUps();
      if (continueBtn) continueBtn.disabled = !complete();
    }

    FIELDS.forEach((id) => el(id) && el(id).addEventListener("change", sync));
    FOLLOW.forEach((id) => el(id + "_info") && el(id + "_info").addEventListener("input", sync));

    (function restore() {
      const saved = FunnelState.all();
      FIELDS.forEach((id) => { if (saved[id] && el(id)) el(id).value = saved[id]; });
      FOLLOW.forEach((id) => { if (saved[id + "_info"] && el(id + "_info")) el(id + "_info").value = saved[id + "_info"]; });
      sync();
    })();

    continueBtn?.addEventListener("click", () => {
      if (continueBtn.disabled) return;
      const patch = {};
      FIELDS.forEach((id) => (patch[id] = el(id) ? el(id).value : ""));
      FOLLOW.forEach((id) => (patch[id + "_info"] = el(id + "_info") ? el(id + "_info").value : ""));
      FunnelState.save(patch);
      window.location.assign("step16.html");
    });
  </script>
