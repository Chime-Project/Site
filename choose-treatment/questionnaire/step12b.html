  <script src="js/quiz-dq.js?v=20260942"></script>
  <script>
    const continueBtn = document.getElementById("continueBtn");
    const FIELDS = ["takenPainMedicationsOrStreetDrugs","gastricBypass6Months"];

    function answerOf(field) {
      const el = document.querySelector('input[name="' + field + '"]:checked');
      return el ? el.value : "";
    }
    function sync() {
      if (continueBtn) continueBtn.disabled = !FIELDS.every((f) => answerOf(f));
    }

    document.querySelectorAll('input[type="radio"]').forEach((el) =>
      el.addEventListener("change", sync)
    );

    (function restore() {
      const saved = FunnelState.all();
      FIELDS.forEach((f) => {
        if (!saved[f]) return;
        const el = document.querySelector(
          'input[name="' + f + '"][value="' + saved[f] + '"]'
        );
        if (el) el.checked = true;
      });
      sync();
    })();

    continueBtn?.addEventListener("click", () => {
      if (continueBtn.disabled) return;
      const patch = {};
      FIELDS.forEach((f) => (patch[f] = answerOf(f)));
      FunnelState.save(patch);
      if (QuizDQ.check("step12b.html")) return;
      window.location.assign("step13.html");
    });
  </script>
