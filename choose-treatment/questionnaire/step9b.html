  <script src="js/quiz-dq.js?v=20260942"></script>
  <script>
    // Female-only screen (GLPQuizFR step4). Reached from S9 only when Female was
    // selected on S7; anyone else goes straight to S10.
    const continueBtn = document.getElementById("continueBtn");
    const noneEl = document.querySelector('input[name="female_health_none"]');
    const conditionEls = Array.prototype.slice.call(
      document.querySelectorAll('input[type="checkbox"]:not([name="female_health_none"])')
    );

    // Anyone who did not select Female should never see this screen, so a direct
    // hit bounces forward rather than asking them.
    (function guard() {
      var sex = "";
      try { sex = (FunnelState.get("sex", "") || "").toLowerCase(); } catch (e) {}
      if (sex && sex !== "female") window.location.replace("step10.html");
    })();

    // "None of the above" is exclusive both ways.
    noneEl?.addEventListener("change", () => {
      if (noneEl.checked) conditionEls.forEach((el) => (el.checked = false));
      syncButton();
    });
    conditionEls.forEach((el) =>
      el.addEventListener("change", () => {
        if (el.checked && noneEl) noneEl.checked = false;
        syncButton();
      })
    );

    function selected() {
      return conditionEls.filter((el) => el.checked).map((el) => el.name);
    }
    function answered() {
      return (noneEl && noneEl.checked) || selected().length > 0;
    }
    function syncButton() {
      if (continueBtn) continueBtn.disabled = !answered();
    }

    (function restore() {
      const saved = FunnelState.all();
      const prior = saved.femaleHealthStatus;
      if (Array.isArray(prior)) {
        if (prior.length === 0 && saved.femaleHealthAnswered && noneEl) noneEl.checked = true;
        conditionEls.forEach((el) => {
          if (prior.indexOf(el.name) !== -1) el.checked = true;
        });
      }
      syncButton();
    })();

    continueBtn?.addEventListener("click", () => {
      if (continueBtn.disabled || !answered()) return;
      FunnelState.save({
        femaleHealthStatus: selected(),
        femaleHealthAnswered: true,
        // GLPQuizFR disqualifies anything here that is not "None of the above".
        // Recorded, not enforced: this build still has no DQ engine.
        femaleHealthDq: selected().length > 0,
      });
      if (QuizDQ.check("step9b.html")) return;
      window.location.assign("step10.html");
    });
  </script>
