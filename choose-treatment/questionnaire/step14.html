  <script src="js/funnel-state.js?v=20260943"></script>
  <script src="js/input-format.js?v=20260943"></script>
  <script>
    const continueBtn = document.getElementById("continueBtn");
    const phoneEl = document.querySelector('input[name="phone"]');
    InputFormat.attachPhone(phoneEl);

    const field = (n) => document.querySelector(`[name="${n}"]`);

    // This screen collected name, email and phone and then discarded all of it.
    // It still transmits nowhere (no endpoint exists yet), but it now at least
    // writes into the same shared record every other screen reads, so a back
    // button no longer wipes what was typed.
    (function restore() {
      const saved = FunnelState.all();
      ["first_name", "last_name", "email", "phone"].forEach((n) => {
        const el = field(n);
        if (el && saved[n]) el.value = n === "phone" ? InputFormat.formatPhone(saved[n]) : saved[n];
      });
      const sms = field("sms_consent");
      if (sms && saved.sms_consent) sms.checked = true;
    })();

    continueBtn?.addEventListener("click", () => {
      FunnelState.save({
        first_name: field("first_name")?.value || "",
        last_name: field("last_name")?.value || "",
        email: field("email")?.value || "",
        phone: phoneEl ? phoneEl.value : "",
        sms_consent: !!field("sms_consent")?.checked,
      });
      window.location.assign("step15.html");
    });
  </script>
