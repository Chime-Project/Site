  <script src="js/quiz-dq.js?v=20260943"></script>
  <script>
    const continueBtn = document.getElementById("continueBtn");
    const boxes = Array.prototype.slice.call(
      document.querySelectorAll('input[name="healthConditionsAdditional"]')
    );
    const noneBox = boxes.filter((b) => b.hasAttribute("data-none"))[0] || null;
    const others = boxes.filter((b) => b !== noneBox);

    // "None" is exclusive in both directions.
    noneBox && noneBox.addEventListener("change", function () {
      if (noneBox.checked) others.forEach((b) => (b.checked = false));
      sync();
    });
    others.forEach((b) =>
      b.addEventListener("change", function () {
        if (b.checked && noneBox) noneBox.checked = false;
        sync();
      })
    );

    function selected() {
      return boxes.filter((b) => b.checked).map((b) => b.value);
    }
    function sync() {
      if (continueBtn) continueBtn.disabled = selected().length === 0;
    }

    (function restore() {
      const prior = FunnelState.get("healthConditionsAdditional", null);
      if (Array.isArray(prior)) {
        boxes.forEach((b) => {
          if (prior.indexOf(b.value) !== -1) b.checked = true;
        });
      }
      sync();
    })();

    continueBtn?.addEventListener("click", () => {
      if (continueBtn.disabled) return;
      FunnelState.save({ healthConditionsAdditional: selected() });
      // Before validation and before navigation, exactly as the reference does.
      if (QuizDQ.check("step11.html")) return;
      window.location.assign("step12.html");
    });
  </script>
