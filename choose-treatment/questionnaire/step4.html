  <script>
    window.addEventListener("pageshow", () => {
      document.querySelectorAll('[class*="animate-ppc-"]').forEach((el) => {
        const classes = Array.from(el.classList).filter((c) =>
          c.startsWith("animate-ppc-"),
        );
        el.classList.remove(...classes);
        void el.offsetWidth;
        el.classList.add(...classes);
      });
    });
  </script>
  <script src="js/funnel-state.js?v=20260943"></script>
  <script>
    const continueBtn = document.getElementById("continueBtn");

    /*
     * The plan screen used to show a hardcoded "Lose 30 lbs in 12 months" with
     * a fixed end date. It now reads S1, S2 and S3.
     *
     * Devin's guard rail: never imply more than 15 lbs a month. If the pace the
     * visitor chose would need a faster rate than that, the timeline is
     * stretched to the shortest safe one and the screen says so plainly rather
     * than quietly showing them something different from what they picked.
     */
    (function renderPlan() {
      const headline = document.getElementById("plan-headline");
      const monthsEl = document.getElementById("plan-months");
      const subline = document.getElementById("plan-subline");
      const midEl = document.getElementById("plan-mid");
      const dateEl = document.getElementById("plan-date");

      const plan = FunnelCalc.plan(
        FunnelState.num("weightLbs", null),
        FunnelState.num("goalWeightLbs", null),
        FunnelState.get("pace", ""),
      );

      // Nothing stored (deep link, cleared storage): leave the markup alone
      // rather than render "NaN lbs".
      if (!plan) return;

      // The projection chart carries its own markers (a hardcoded 190 at the
      // start and 160 at "Your goal"), which is what a visitor actually reads
      // off the graphic. They animate in after the headline, so they are easy
      // to miss unless you wait for the curve to finish drawing. Set before
      // the maintenance branch returns, so they are correct either way.
      const startEl = document.getElementById("chart-start-lbs");
      const goalEl = document.getElementById("chart-goal-lbs");
      const startLbs = FunnelState.num("weightLbs", null);
      const goalLbs = FunnelState.num("goalWeightLbs", null);
      if (startEl && startLbs !== null) startEl.textContent = Math.round(startLbs);
      if (goalEl && goalLbs !== null) goalEl.textContent = Math.round(goalLbs);

      if (plan.maintenance) {
        if (headline) headline.textContent = "Maintain your weight";
        if (monthsEl) monthsEl.textContent = "12 months";
        if (subline)
          subline.textContent =
            "Your target is at or above your current weight, so your clinician will focus on maintenance and metabolic health.";
        if (midEl) midEl.textContent = "6 mo";
        if (dateEl)
          dateEl.textContent = FunnelCalc.shortDate(
            FunnelCalc.addMonths(new Date(), 12),
          );
        return;
      }

      if (headline) headline.textContent = "Lose " + plan.lbs + " lbs";
      if (monthsEl)
        monthsEl.textContent =
          plan.months + (plan.months === 1 ? " month" : " months");

      if (subline) {
        subline.textContent = plan.capped
          ? "A safe pace is up to " +
            FunnelCalc.MAX_LBS_PER_MONTH +
            " lbs a month, so we have set your timeline to " +
            plan.months +
            " months, about " +
            plan.perMonth +
            " lbs a month. Your clinician confirms the final plan."
          : "That is about " +
            plan.perMonth +
            " lbs a month. Your dose, plan and timeline are set to match, and your clinician confirms the final plan.";
      }

      if (midEl) {
        const mid = Math.max(1, Math.round(plan.months / 2));
        midEl.textContent = mid + " mo";
      }
      if (dateEl)
        dateEl.textContent = FunnelCalc.shortDate(
          FunnelCalc.addMonths(new Date(), plan.months),
        );
    })();

    continueBtn?.addEventListener("click", () => {
      window.location.assign("step5.html");
    });
