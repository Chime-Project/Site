  <script src="js/funnel-state.js?v=20260945"></script>
  <script>
    const continueBtn = document.getElementById("continueBtn");
    const goalEl = document.getElementById("weight");
    const goalCard = document.getElementById("goal-card");
    const goalPct = document.getElementById("goal-pct");
    const goalNote = document.getElementById("goal-note");

    const currentLbs = FunnelState.num("weightLbs", null);

    // Replaces the hardcoded "lose 99% of your weight". Needs the weight from
    // S1, so if a visitor deep-links straight here the card stays hidden
    // rather than printing a number it cannot support.
    function render() {
      const goal = parseFloat(goalEl ? goalEl.value : "");
      const valid = isFinite(goal) && goal > 0;

      if (continueBtn) continueBtn.disabled = !valid;

      if (!valid || currentLbs === null) {
        goalCard.classList.add("hidden");
        return;
      }

      const toLose = currentLbs - goal;
      if (toLose <= 0) {
        goalPct.textContent = "That is at or below your current weight.";
        goalNote.textContent =
          "Your clinician can talk through maintenance options with you.";
      } else {
        const pct = Math.round((toLose / currentLbs) * 100);
        goalPct.textContent =
          "That is " + Math.round(toLose) + " lbs, about " + pct + "% of your weight.";
        goalNote.textContent = "We'll help break it into achievable milestones.";
      }
      goalCard.classList.remove("hidden");
    }

    if (goalEl) {
      goalEl.addEventListener("input", render);
      goalEl.addEventListener("change", render);
    }

    (function restore() {
      const saved = FunnelState.get("goalWeightLbs", "");
      if (goalEl && saved) goalEl.value = saved;
      render();
    })();

    continueBtn?.addEventListener("click", () => {
      if (continueBtn.disabled) return;
      FunnelState.save({ goalWeightLbs: goalEl ? goalEl.value : "" });
      window.location.assign("step3.html");
    });
  </script>
